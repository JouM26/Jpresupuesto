name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Environment diagnostics
        run: |
          python --version
          pip --version
          python -m PyInstaller --version
          pip show kivy
          pip show kivymd
          pip show reportlab

      - name: Build executable (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name JPresupuesto --collect-data kivy --collect-binaries kivy --collect-data kivymd --collect-binaries kivymd --hidden-import kivy_deps.angle --hidden-import kivy_deps.glew --hidden-import kivy_deps.sdl2 app.py *>&1 | Tee-Object -FilePath pyinstaller.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller fallo. Revisa pyinstaller.log en artifacts."
            exit $LASTEXITCODE
          }

      - name: Validate build output
        run: |
          if (!(Test-Path "dist/JPresupuesto")) {
            Write-Error "No existe dist/JPresupuesto luego del build."
            exit 1
          }

      - name: Package build output
        run: |
          Compress-Archive -Path dist/JPresupuesto/* -DestinationPath dist/JPresupuesto-windows.zip -Force

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            pyinstaller.log
            build/**

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPresupuesto-windows
          path: dist/JPresupuesto-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JPresupuesto-windows.zip
