name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      KIVY_NO_ARGS: "1"
      KIVY_WINDOW: "mock"
      KIVY_GL_BACKEND: "mock"
      KIVY_AUDIO: "mock"
      KIVY_NO_CONSOLELOG: "1"
      PYI_LOG_LEVEL: "INFO"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Environment diagnostics
        run: |
          python --version
          pip --version
          python -m PyInstaller --version
          echo "KIVY_WINDOW=$env:KIVY_WINDOW"
          echo "KIVY_GL_BACKEND=$env:KIVY_GL_BACKEND"
          pip show kivy
          pip show kivymd
          pip show reportlab

      - name: Build executable (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --log-level INFO --name JPresupuesto --hidden-import kivy_deps.angle --hidden-import kivy_deps.glew --hidden-import kivy_deps.sdl2 --hidden-import kivymd --exclude-module kivy.tests app.py > pyinstaller.log 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "PyInstaller fallo. Revisa pyinstaller.log en artifacts."
            Get-Content pyinstaller.log -Tail 200
            exit $exitCode
          }

      - name: Validate build output
        run: |
          if (!(Test-Path "dist/JPresupuesto")) {
            Write-Error "No existe dist/JPresupuesto luego del build."
            exit 1
          }

      - name: Package build output
        run: |
          Compress-Archive -Path dist/JPresupuesto/* -DestinationPath dist/JPresupuesto-windows.zip -Force

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            pyinstaller.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPresupuesto-windows
          path: dist/JPresupuesto-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JPresupuesto-windows.zip
