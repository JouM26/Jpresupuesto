name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (Docker)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          if [[ ! -f "$GITHUB_WORKSPACE/buildozer.spec" ]]; then
            echo "ERROR: buildozer.spec no existe en la raiz del repo."
            exit 1
          fi
          echo "buildozer.spec encontrado."
          head -n 40 "$GITHUB_WORKSPACE/buildozer.spec"

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "yes | sdkmanager --licenses > /dev/null 2>&1 || true; buildozer -v android debug"

      - name: Validate APK output
        run: |
          ls -la bin || true
          if [[ -z "$(ls -1 bin/*.apk 2>/dev/null)" ]]; then
            echo "ERROR: No se genero ningun APK en bin/."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPresupuesto-android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
