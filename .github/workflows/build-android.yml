name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (Docker)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          if [[ ! -f "$GITHUB_WORKSPACE/buildozer.spec" ]]; then
            echo "buildozer.spec no existe. Generando uno temporal con la configuracion del proyecto."
            cat > "$GITHUB_WORKSPACE/buildozer.spec" <<'EOF'
[app]

title = JPresupuesto
package.name = jpresupuesto
package.domain = com.joum26

source.dir = .
source.include_exts = py,png,jpg,jpeg,kv,atlas,ttf,txt,md,json
source.exclude_dirs = .git,.github,__pycache__,venv,.venv,build,dist

version = 0.1.0

requirements = python3,kivy==2.3.1,kivymd==1.2.0,fpdf2,pillow

orientation = portrait
fullscreen = 0

android.api = 33
android.minapi = 24
android.archs = arm64-v8a,armeabi-v7a

[buildozer]

log_level = 2
warn_on_root = 1
EOF
          fi
          echo "buildozer.spec encontrado."
          head -n 40 "$GITHUB_WORKSPACE/buildozer.spec"

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            -v android debug

      - name: Validate APK output
        run: |
          ls -la bin || true
          if [[ -z "$(ls -1 bin/*.apk 2>/dev/null)" ]]; then
            echo "ERROR: No se genero ningun APK en bin/."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPresupuesto-android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
